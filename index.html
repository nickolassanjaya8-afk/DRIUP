<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Menghapus fitur Zoom -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DRIUP — TopUp ML & FF</title>
  <style>
    /* Mencegah Copy/Seleksi Teks */
    * { margin:0; padding:0; box-sizing:border-box; -webkit-user-select: none; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1614; min-height: 100vh; padding: 16px; color: #e6ddd6; }
    
    .container { max-width: 820px; margin: 0 auto; background: #26211e; border-radius: 28px; padding: 24px 20px; border: 1px solid #3d3530; box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
    
    .sticky-header { position: sticky; top: 0; background: rgba(38,33,30,0.92); backdrop-filter: blur(8px); z-index: 100; padding: 12px 0; border-bottom: 2px solid #3d3530; margin: -24px -20px 20px -20px; padding: 14px 20px; border-top-left-radius: 28px; border-top-right-radius: 28px; }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .header .logo { font-size: 22px; font-weight: 700; color: #e6b87e; cursor: pointer; }
    
    /* SLIDER BANNER */
    .slider-container { width: 100%; height: 180px; position: relative; overflow: hidden; border-radius: 20px; margin-bottom: 20px; border: 1px solid #3d3530; }
    .slide { width: 100%; height: 100%; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; object-fit: cover; }
    .slide.active { opacity: 1; }

    .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .game-card-home { background: #2e2723; border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #3d3530; transition: 0.2s; cursor: pointer; }
    .game-card-home:hover { transform: translateY(-3px); border-color: #5a4d44; }
    /* Fix Logo Hitam: Cover agar presisi */
    .game-card-home img { width: 80px; height: 80px; object-fit: cover; border-radius: 16px; margin-bottom: 12px; }
    
    .btn-home { background: #e6b87e; border: none; padding: 10px 24px; border-radius: 40px; color: #1a1614; font-weight: 600; font-size: 14px; cursor: pointer; }
    
    /* Sisipkan style sisanya dari kode lama kamu di sini ... (Sama persis) */
  </style>
</head>
<body>
<div class="container">
  
  <div class="sticky-header">
    <div class="header">
      <div class="logo" id="logo" onclick="triggerAdmin()">DRIUP</div>
      <nav class="nav">
        <span class="cek-btn" onclick="openCekModal()">🔍 Cek</span>
        <span class="all-btn" id="allOrdersBtn" onclick="showAllOrders()">📋 Semua</span>
      </nav>
    </div>
  </div>

  <!-- SLIDER AREA -->
  <div class="slider-container">
    <img src="BANNER1.PNG" class="slide active">
    <img src="BANNER2.PNG" class="slide">
    <img src="BANNER3.PNG" class="slide">
  </div>

  <div class="page active" id="page-home">
    <h2 style="font-size:22px; font-weight:600; margin-bottom:4px; color:#e6b87e;">Top Up Game Murah</h2>
    <div class="home-grid">
      <div class="game-card-home" onclick="navigateTo('ml')">
        <img src="ML.PNG" alt="ML">
        <h3>ML</h3>
        <button class="btn-home">Top Up</button>
      </div>
      <div class="game-card-home" onclick="navigateTo('ff')">
        <img src="FF.PNG" alt="FF">
        <h3>FF</h3>
        <button class="btn-home">Top Up</button>
      </div>
    </div>
  </div>

  <!-- Script Slider -->
  <script>
    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
    setInterval(nextSlide, 3000);
    // ... sambungkan dengan script lama kamu (fungsi firebase, modal, dll)
  </script>
</div>
</body>
</html>
