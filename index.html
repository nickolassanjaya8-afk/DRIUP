<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DRIUP - Top Up FF &amp; ML</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <img src="assets/banner.svg" alt="DRIUP banner" class="banner">
    <div class="brand">
      <h1>DRIUP</h1>
      <p class="tag">Top up cepat & aman — Free Fire & Mobile Legends</p>
    </div>
  </header>

  <main class="container">
    <!-- Updated cards grid (replaces previous .games section) -->
    <section class="games cards-grid">
      <article class="card">
        <div class="thumb">
          <img src="assets/images/game1.svg" alt="Mobile Legends thumbnail">
        </div>
        <div class="card-caption">
          <div class="card-title">Mobile Legends:<br>Bang Bang</div>
        </div>
      </article>

      <article class="card">
        <div class="thumb">
          <img src="assets/images/game2.svg" alt="Free Fire thumbnail">
        </div>
        <div class="card-caption">
          <div class="card-title">Free Fire<br>Top-up</div>
        </div>
      </article>
    </section>

    <section id="order" class="order hidden">
      <h3 id="order-title">Form Top Up</h3>
      <form id="order-form">
        <label>Game
          <input type="text" name="game" id="game" readonly>
        </label>
        <label>ID Pemain
          <input type="text" name="playerId" id="playerId" placeholder="Masukkan ID pemain" required>
        </label>
        <label>Paket
          <select name="package" id="package">
            <option value="50">50 Diamonds - Rp 10.000</option>
            <option value="100">100 Diamonds - Rp 18.000</option>
            <option value="500">500 Diamonds - Rp 85.000</option>
          </select>
        </label>
        <label>Email (opsional)
          <input type="email" name="email" id="email" placeholder="user@example.com">
        </label>
        <div class="form-actions">
          <button type="submit" class="btn primary">Pesan Sekarang</button>
          <button type="button" id="cancel" class="btn ghost">Batal</button>
        </div>
      </form>
      <div id="result" class="result"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> DRIUP — All rights reserved.</p>
  </footer>

  <script>
    // Simple interactivity: buka form top up dan tunjukkan ringkasan pesanan.
    document.getElementById('year').textContent = new Date().getFullYear();

    const buttons = document.querySelectorAll('.btn[data-game]');
    const orderSection = document.getElementById('order');
    const gameInput = document.getElementById('game');
    const form = document.getElementById('order-form');
    const result = document.getElementById('result');
    const cancel = document.getElementById('cancel');

    // Fallback: if user clicks card, open order form and set game name
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => {
        const titleEl = card.querySelector('.card-title');
        const name = titleEl ? titleEl.textContent.replace(/\n/g, ' ').trim() : 'Game';
        gameInput.value = name;
        result.innerHTML = '';
        orderSection.classList.remove('hidden');
        orderSection.scrollIntoView({behavior: 'smooth'});
      });
    });

    if(buttons){
      buttons.forEach(b => b.addEventListener('click', (e) => {
        e.stopPropagation();
        const g = b.getAttribute('data-game');
        gameInput.value = g;
        result.innerHTML = '';
        orderSection.classList.remove('hidden');
        orderSection.scrollIntoView({behavior: 'smooth'});
      }));
    }

    cancel.addEventListener('click', () => {
      orderSection.classList.add('hidden');
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const data = new FormData(form);
      const summary = `Pesanan diterima:\nGame: ${data.get('game')}\nID Pemain: ${data.get('playerId')}\nPaket: ${data.get('package')} Diamonds\nEmail: ${data.get('email') || '-'}\n\n(Tips: ini hanyalah demo — hubungi penjual untuk pembayaran nyata)`;
      result.innerText = summary;
      result.classList.add('visible');
      window.scrollTo({ top: result.offsetTop - 20, behavior: 'smooth' });
    });
  </script>
</body>
</html>
